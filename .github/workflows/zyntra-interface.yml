name: ZyntraAcesso - conferir interface

on:
  workflow_dispatch:
  push:
    branches: ['codex/zyntraacesso']
    paths: ['.github/workflows/zyntra-interface.yml']

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: false
      - name: Testar os componentes visuais sem iniciar acesso remoto
        working-directory: flutter
        run: |
          flutter pub get
          flutter test test/zyntra_access_test.dart
